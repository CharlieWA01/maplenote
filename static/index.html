<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maplenote</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="toolbar">
    <span class="brand">Maplenote</span>
    <button id="new-button" type="button">New file</button>
    <button id="open-button" type="button" title="Open a file from your device">Open…</button>
    <!-- Fallback for browsers that can't save back to the original file. -->
    <input id="file-input" type="file" multiple hidden accept=".txt,.md,.log,text/plain,text/markdown">
    <button id="save-button" type="button" disabled title="Save now (Ctrl+S)">Save</button>
    <button id="rename-button" type="button" disabled>Rename</button>
    <button id="delete-button" type="button" disabled>Delete</button>
    <button id="find-button" type="button" disabled title="Find and replace (Ctrl+F)">Find</button>
    <span id="status" class="status" role="status"></span>
    <!-- Guest mode only (see app.js): where a guest's notes are kept, and the way in for Charlie. -->
    <span id="guest-bar" class="guest-bar" hidden>
      <span title="Your notes are saved in this browser only. Nothing is sent to a server.">Guest · notes stay in this browser</span>
      <button id="download-notes-button" type="button" title="Download all your notes as a .zip file, to keep them">Download all</button>
      <a href="/login">Sign in</a>
    </span>
    <!-- Hosted only (there's a password): signs out and clears this browser's copies of your notes. -->
    <button id="sign-out-button" class="sign-out" type="button" hidden title="Sign out, and remove this browser's copies of your unsaved notes and open tabs">Sign out</button>
    <!-- A setting, not an action, so it sits apart from the buttons at the far right. -->
    <label class="toggle" title="Save automatically a moment after you stop typing">
      <input id="autosave-toggle" type="checkbox"> Autosave
    </label>
  </header>

  <div class="workspace">
    <nav id="file-tree" class="sidebar" aria-label="Files"></nav>

    <main class="editor-pane">
      <div class="tab-row">
        <div id="tabs" class="tabs" role="tablist"></div>
        <!-- Shown only for Markdown (.md) tabs. -->
        <div id="view-switch" class="view-switch" role="group" aria-label="Markdown view" hidden>
          <button id="edit-mode-button" type="button" aria-pressed="true" title="Edit (Ctrl+E switches)">Edit</button>
          <button id="preview-mode-button" type="button" aria-pressed="false" title="Preview (Ctrl+E switches)">Preview</button>
        </div>
      </div>
      <!-- Conflict and crash-recovery messages for the active tab. -->
      <div id="banner" class="banner" role="alert" hidden></div>
      <div id="reconnect" class="notice" hidden>
        <p>Maplenote needs your permission again to open <strong id="reconnect-name"></strong>.</p>
        <button id="reconnect-button" type="button">Allow access</button>
      </div>
      <!-- CodeMirror builds the editor inside this element (see app.js). -->
      <div id="editor" class="editor"></div>
      <!-- The rendered Markdown, when a .md tab is in Preview mode. -->
      <article id="preview" class="preview" tabindex="0" hidden></article>
      <footer class="statusbar">
        <span id="cursor-info"></span>
        <span id="count-info"></span>
        <label class="toggle" title="Wrap long lines to fit the window">
          <input id="wrap-toggle" type="checkbox"> Word wrap
        </label>
        <!-- The version (from static/changelog.md); opens the About box. -->
        <button id="about-button" class="about-button" type="button" title="About Maplenote: version and what's new">Maplenote</button>
      </footer>
    </main>
  </div>

  <!-- Asked when closing a tab that has unsaved edits and won't be autosaved. -->
  <dialog id="unsaved-dialog" class="dialog">
    <form method="dialog">
      <p>Save changes to <strong id="unsaved-name"></strong> before closing?</p>
      <div class="dialog-buttons">
        <button value="save" type="submit" autofocus>Save</button>
        <button value="discard" type="submit">Don't save</button>
        <button value="cancel" type="submit">Cancel</button>
      </div>
    </form>
  </dialog>

  <!-- About Maplenote: the version, the build it came from, and the changelog. -->
  <dialog id="about-dialog" class="dialog about-dialog" aria-labelledby="about-title">
    <form method="dialog">
      <h2 id="about-title">Maplenote <span id="about-version"></span></h2>
      <p id="about-build" class="about-build"></p>
      <div id="changelog" class="preview changelog"></div>
      <div class="dialog-buttons">
        <button value="close" type="submit" autofocus>Close</button>
      </div>
    </form>
  </dialog>

  <!-- CodeMirror 6, bundled into one file (see vendor-src/README.md). Defines `CM`. -->
  <script src="/static/vendor/codemirror.js"></script>
  <!-- markdown-it, for the Markdown preview. Defines `MD`. -->
  <script src="/static/vendor/markdown-it.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

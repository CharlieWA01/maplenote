<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maplenote</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="toolbar">
    <span class="brand">Maplenote</span>
    <button id="new-button" type="button">New file</button>
    <button id="open-button" type="button" title="Open a file from your device">Open…</button>
    <!-- Fallback for browsers that can't save back to the original file. -->
    <input id="file-input" type="file" multiple hidden accept=".txt,.md,.log,text/plain,text/markdown">
    <button id="save-button" type="button" disabled>Save</button>
    <button id="rename-button" type="button" disabled>Rename</button>
    <button id="delete-button" type="button" disabled>Delete</button>
    <button id="find-button" type="button" disabled title="Find and replace (Ctrl+F)">Find</button>
    <span id="status" class="status" role="status"></span>
    <!-- A setting, not an action, so it sits apart from the buttons at the far right. -->
    <label class="toggle" title="Save automatically a moment after you stop typing">
      <input id="autosave-toggle" type="checkbox"> Autosave
    </label>
  </header>

  <div class="workspace">
    <nav id="file-tree" class="sidebar" aria-label="Files"></nav>

    <main class="editor-pane">
      <div id="tabs" class="tabs" role="tablist"></div>
      <!-- Conflict and crash-recovery messages for the active tab. -->
      <div id="banner" class="banner" role="alert" hidden></div>
      <div id="reconnect" class="notice" hidden>
        <p>Maplenote needs your permission again to open <strong id="reconnect-name"></strong>.</p>
        <button id="reconnect-button" type="button">Allow access</button>
      </div>
      <!-- CodeMirror builds the editor inside this element (see app.js). -->
      <div id="editor" class="editor"></div>
      <footer class="statusbar">
        <span id="cursor-info"></span>
        <span id="count-info"></span>
        <label class="toggle" title="Wrap long lines to fit the window">
          <input id="wrap-toggle" type="checkbox"> Word wrap
        </label>
      </footer>
    </main>
  </div>

  <!-- Asked when closing a tab that has unsaved edits and won't be autosaved. -->
  <dialog id="unsaved-dialog" class="dialog">
    <form method="dialog">
      <p>Save changes to <strong id="unsaved-name"></strong> before closing?</p>
      <div class="dialog-buttons">
        <button value="save" type="submit" autofocus>Save</button>
        <button value="discard" type="submit">Don't save</button>
        <button value="cancel" type="submit">Cancel</button>
      </div>
    </form>
  </dialog>

  <!-- CodeMirror 6, bundled into one file (see vendor-src/README.md). Defines `CM`. -->
  <script src="/static/vendor/codemirror.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

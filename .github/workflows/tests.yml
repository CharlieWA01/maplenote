# Runs the whole test suite (API tests and browser tests) on every pull
# request and every push to main. See README.md, "Running the tests".
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # same as Charlie's Chromebook
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python packages
        run: pip install -r requirements-dev.txt

      - name: Install the browser the tests drive
        run: python -m playwright install --with-deps chromium

      # "--browser-channel chromium" runs the full Chromium without a window, like
      # real Chrome. Playwright's default "headless shell" is a stripped-down
      # build that crashed on reopening files from the device after a reload.
      - name: Run the tests
        run: |
          set -o pipefail
          python -m pytest --browser-channel chromium --tracing retain-on-failure 2>&1 | tee pytest-output.txt

      # Show each failing test as an annotation on the PR, readable without
      # opening the full log.
      - name: Report failing tests on the PR
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | while read -r line; do
            echo "::error title=Test failed::$line"
          done || true
          grep -E '^E  ' pytest-output.txt | head -20 | while read -r line; do
            echo "::error title=Failure detail::$line"
          done || true

      # If a browser test fails, keep a step-by-step recording of it.
      # Open it with: python -m playwright show-trace <file>.zip
      - name: Keep traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

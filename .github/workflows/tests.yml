# Runs the whole test suite (API tests and browser tests) on every pull
# request and every push to main, and checks the Docker image builds and
# runs. See README.md, "Running the tests".
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # same as Charlie's Chromebook
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python packages
        run: pip install -r requirements-dev.txt

      - name: Install the browser the tests drive
        run: python -m playwright install --with-deps chromium

      # "--browser-channel chromium" runs the full Chromium without a window, like
      # real Chrome. Playwright's default "headless shell" is a stripped-down
      # build that crashed on reopening files from the device after a reload.
      - name: Run the tests
        run: |
          set -o pipefail
          python -m pytest --browser-channel chromium --tracing retain-on-failure 2>&1 | tee pytest-output.txt

      # Show failures as annotations on the PR, readable without opening the
      # full log: the summary, the complete report of the first failure (GitHub
      # shows at most 10 annotations per step), then the failing test names.
      - name: Report failing tests on the PR
        if: failure()
        shell: python
        run: |
          import re
          lines = open("pytest-output.txt", encoding="utf-8", errors="replace").read().splitlines()
          lines = [l for l in lines if not l.startswith("INFO ")]

          def annotate(title, text):
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{text}")

          summary = [l for l in lines if re.match(r"^=*\s*\d+ (passed|failed|error)", l)]
          annotate("Test summary", summary[-1] if summary else "pytest did not finish")
          # A real test failure is the root cause; setup "errors" are often knock-on
          # effects of it, and pytest prints them first. So prefer the FAILURES section.
          sections = [i for i, l in enumerate(lines) if re.match(r"=+ (FAILURES|ERRORS) =+$", l)]
          failures = [i for i in sections if "FAILURES" in lines[i]] or sections
          start = failures[0] if failures else 0
          headers = [i for i, l in enumerate(lines) if i > start and re.match(r"_{3,} .* _{3,}$", l)]
          if headers:
              first = headers[0]
              stop = headers[1] if len(headers) > 1 else first + 150
              annotate("First failure", "\n".join(lines[first:stop][:150]))
          failed = [l for l in lines if l.startswith("FAILED ")] + [l for l in lines if l.startswith("ERROR ")]
          for line in failed[:7]:
              annotate("Test failed", line)

      # If a browser test fails, keep a step-by-step recording of it.
      # Open it with: python -m playwright show-trace <file>.zip
      - name: Keep traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Builds the Docker image the deploy workflow ships, and runs it the way
  # Lambda does: read-only disk except /tmp, as a non-root user. Catches a
  # broken Dockerfile on the pull request instead of during a deploy.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Lambda Web Adapter comes from AWS's public registry, which
      # refuses anonymous downloads once a runner's shared IP address has
      # used its monthly allowance ("429 Too Many Requests"; see
      # docs/DECISIONS.md, 2026-10-22). Pull requests can't sign in (they get
      # no AWS role), so keep a copy of the adapter in GitHub's cache: Docker
      # then builds from the local copy and never asks the registry. The
      # key follows the Dockerfile's version, so an upgrade fetches anew.
      - name: Which adapter the Dockerfile uses
        run: echo "ADAPTER=$(grep -oE 'public\.ecr\.aws/awsguru/aws-lambda-adapter:[0-9.]+' Dockerfile)" >> "$GITHUB_ENV"

      - name: Restore the cached adapter
        id: adapter-cache
        uses: actions/cache@v6
        with:
          path: /tmp/lambda-adapter.tar
          key: lambda-adapter-${{ env.ADAPTER }}

      - name: Load the cached adapter, or download it (with retries) and save it
        run: |
          if [ -f /tmp/lambda-adapter.tar ]; then
            docker load -i /tmp/lambda-adapter.tar
            exit 0
          fi
          for attempt in 1 2 3 4; do
            docker pull --platform linux/amd64 "$ADAPTER" && break
            [ "$attempt" = 4 ] && exit 1
            echo "::warning::Pulling the adapter failed (attempt $attempt); trying again in $((attempt * 20)) s."
            sleep $((attempt * 20))
          done
          docker save -o /tmp/lambda-adapter.tar "$ADAPTER"

      - name: Build the image
        run: docker build --provenance=false --platform linux/amd64 --build-arg MAPLENOTE_COMMIT=ci-test-commit -t maplenote:test .

      - name: Run it with a local folder and check it serves and saves
        run: |
          mkdir data && sudo chown 1000 data
          docker run -d --name maplenote --read-only --tmpfs /tmp -p 8000:8080 -v "$PWD/data:/data" maplenote:test
          for i in $(seq 20); do curl -sf http://localhost:8000/ > /dev/null && break; sleep 0.5; done
          curl -sf http://localhost:8000/ | grep -q '<title>'
          curl -sf http://localhost:8000/static/build.json | grep -q '"commit": "ci-test-commit"'
          curl -sf -X PUT -H 'Content-Type: application/json' -d '{"content":"hello"}' 'http://localhost:8000/api/file?path=a.txt'
          test "$(cat data/a.txt)" = hello
          docker rm -f maplenote

      - name: With a password set, it refuses requests without it
        run: |
          hash=$(docker run --rm maplenote:test python -c "from werkzeug.security import generate_password_hash as h; print(h('ci-only password'))")
          docker run -d --name maplenote --read-only --tmpfs /tmp --tmpfs /data:uid=1000 -p 8000:8080 -e MAPLENOTE_PASSWORD_HASH="$hash" maplenote:test
          for i in $(seq 20); do curl -s http://localhost:8000/ > /dev/null && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/files)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u x:'ci-only password' http://localhost:8000/api/files)" = 200

      - name: Refuses to start on Lambda without a password
        run: |
          ! docker run --rm -e AWS_LAMBDA_FUNCTION_NAME=test maplenote:test python -c "import app"

      - name: Show the app's output if anything failed
        if: failure()
        run: docker logs maplenote || true
